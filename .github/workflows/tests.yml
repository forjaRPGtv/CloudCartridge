name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-7:
    name: PowerShell 7
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Executar regressão
        shell: pwsh
        run: ./tests/Run-Tests.ps1

  windows-powershell-5:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Executar regressão
        shell: powershell
        run: .\tests\Run-Tests.ps1
