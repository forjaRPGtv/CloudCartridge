name: Sugerir uma melhoria
description: Proponha uma evolução compatível com os limites do projeto.
title: "[Melhoria]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Necessidade
      description: Qual problema real a melhoria resolveria?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Explique o fluxo esperado e alternativas consideradas.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Riscos
      description: Impacto possível em saves, cache, autenticação, privacidade ou compatibilidade.
  - type: checkboxes
    id: principles
    attributes:
      label: Princípios
      options:
        - label: A proposta não depende da distribuição não autorizada de conteúdo.
          required: true
        - label: A proposta não exige expor o Host diretamente na Internet.
          required: true
